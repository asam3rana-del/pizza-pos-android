plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pizzashop.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.pizzashop.pos"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// No extra libraries on purpose: the app only uses what Android already contains.
dependencies {
}
